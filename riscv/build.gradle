plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'li.cil.oc'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://fnuecke.github.io/maven'
        content {
            includeModule('li.cil.sedna', 'sedna-buildroot')
        }
    }
}

dependencies {
    // Resolved from the included builds in deps/ via dependency substitution.
    api 'li.cil.sedna:sedna:5.0.0'
    api 'li.cil.ceres:ceres:0.0.7'

    implementation 'li.cil.sedna:sedna-buildroot:0.2.9'
    implementation 'it.unimi.dsi:fastutil:8.5.6'

    // Provided by Minecraft at runtime.
    compileOnly 'org.apache.logging.log4j:log4j-api:2.15.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-api:2.15.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// The jar embedded into the mod: our code, Sedna, ceres, the Linux image and their libraries, with
// the libraries moved to our own package so they cannot clash with the versions Minecraft ships.
shadowJar {
    archiveClassifier = 'shaded'
    dependencies {
        exclude(dependency('org.apache.logging.log4j:.*'))
        exclude(dependency('com.google.code.findbugs:.*'))
    }
    relocate 'it.unimi.dsi.fastutil', 'li.cil.oc.repack.fastutil'
    relocate 'org.apache.commons.io', 'li.cil.oc.repack.commons.io'
    relocate 'org.apache.commons.lang3', 'li.cil.oc.repack.commons.lang3'
    relocate 'org.objectweb.asm', 'li.cil.oc.repack.asm'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**', 'module-info.class'
}
