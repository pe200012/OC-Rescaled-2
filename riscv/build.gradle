plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'ocsquared'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Resolved from the included builds in deps/ via dependency substitution.
    api 'li.cil.sedna:sedna:5.0.0'
    api 'li.cil.ceres:ceres:0.0.7'
    implementation 'li.cil.sedna:sedna-buildroot:0.0.0'
    implementation 'it.unimi.dsi:fastutil:8.5.6'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Provided by Minecraft at runtime.
    compileOnly 'org.apache.logging.log4j:log4j-api:2.15.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-api:2.15.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    maxHeapSize = '1g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// The jar embedded into the mod: our code, Sedna, ceres, the Linux image and their libraries, with
// the libraries moved to our own package so they cannot clash with the versions Minecraft ships.
shadowJar {
    archiveClassifier = 'shaded'
    dependencies {
        exclude(dependency('org.apache.logging.log4j:.*'))
        exclude(dependency('com.google.code.findbugs:.*'))
        exclude(dependency('com.google.errorprone:.*'))
    }
    relocate 'it.unimi.dsi.fastutil', 'ocsquared.repack.fastutil'
    relocate 'org.apache.commons.io', 'ocsquared.repack.commons.io'
    relocate 'org.apache.commons.lang3', 'ocsquared.repack.commons.lang3'
    relocate 'org.objectweb.asm', 'ocsquared.repack.asm'
    relocate 'com.google.gson', 'ocsquared.repack.gson'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**', 'module-info.class'
}

// The guest's device bus libraries, served to the machine as a 9p file system.
def packageScripts = tasks.register('packageScripts', Zip) {
    archiveFileName = 'scripts.zip'
    destinationDirectory = layout.buildDirectory.dir('scripts')
    from 'src/main/scripts'
    exclude '**/__pycache__/**', 'README.md'
}

processResources {
    from(packageScripts) {
        into 'ocsquared/riscv'
    }
}
