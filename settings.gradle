pluginManagement {
    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.arcseekers.com/releases/'
        }
        maven {
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.wagyourtail.xyz/releases"
        }
        maven {
            url = "https://maven.wagyourtail.xyz/snapshots"
        }
        gradlePluginPortal() {
            content {
                excludeGroup("org.apache.logging.log4j")
            }
        }
    }
}

plugins {
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Due to an IntelliJ bug, this has to be done
// rootProject.name = archives_base_name
rootProject.name = rootProject.projectDir.getName()

include 'riscv'

// Sedna, its serialization library and the Linux image, built from the submodules so they can be
// patched in place. The image builds in Docker, once, then again only when its config changes.
includeBuild('deps/ceres')
includeBuild('deps/sedna')
includeBuild('deps/buildroot')
